services:
  db:
    image: pgvector/pgvector:pg16
    container_name: documind-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-documind_db}
      POSTGRES_USER: ${POSTGRES_USER:-documind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-documind_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-documind_user} -d ${POSTGRES_DB:-documind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
